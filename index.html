<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Buddy: Pastel Dream 🐶🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pastel: #FFF5F7;
            --card-white: rgba(255, 255, 255, 0.9);
            --text-main: #4A4A4A; /* สีข้อความเข้ม อ่านง่าย */
            --p-pink: #FFD1DC;
            --p-blue: #B2E2F2;
            --p-green: #C1E1C1;
            --p-yellow: #FFF9C4;
            --accent: #FF85A1;
        }

        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; color: var(--text-main); }

        body { 
            background-color: var(--bg-pastel);
            /* เพิ่มความฟุ้งฟิ้งด้วยลวดลาย Background */
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png"); 
            display: flex; justify-content: center; padding: 20px; margin: 0;
            min-height: 100vh;
            position: relative;
        }

        /* ตกแต่ง Background เพิ่มเติมด้วย Emoji ฟุ้งฟิ้ง */
        body::before {
            content: "🐶 🎀 🧺 🌟 💰 🐶 🎀 🧺 🌟";
            position: fixed; top: 5%; left: 0; right: 0;
            font-size: 20px; opacity: 0.15; text-align: center; z-index: -1;
            letter-spacing: 50px; line-height: 100px;
        }

        .app-container { 
            width: 100%; max-width: 450px; 
            background: var(--card-white); 
            border-radius: 40px; padding: 25px; 
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.2);
            border: 3px solid var(--p-pink);
            backdrop-filter: blur(5px);
        }

        /* Header & Level */
        .header { text-align: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 30px; border: 2px dashed var(--p-pink); }
        #mascot { font-size: 60px; display: block; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1)); }
        .level-badge { background: var(--accent); color: white; padding: 4px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .xp-container { width: 100%; background: #eee; height: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; }
        #xp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #FFB7C5, #FF85A1); border-radius: 10px; transition: 0.8s; }

        /* Calendar */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 15px 0; }
        .cal-date { 
            aspect-ratio: 1/1.2; border-radius: 15px; background: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; border: 1px solid #FFE4E1;
        }
        .day-money { font-size: 9px; color: #888; font-weight: normal; }
        .status-good { background-color: var(--p-green) !important; border-color: #8FBC8F; }
        .status-warning { background-color: var(--p-yellow) !important; border-color: #E6E6FA; }
        .status-danger { background-color: var(--p-pink) !important; border-color: #F08080; }

        .legend { display: flex; justify-content: center; gap: 10px; font-size: 10px; margin-bottom: 20px; font-weight: bold; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }

        /* Dashboard Card */
        .main-card { 
            background: linear-gradient(135deg, #FFD1DC 0%, #B2E2F2 100%); 
            border-radius: 30px; padding: 25px; text-align: center; margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.5);
        }
        .main-card small { font-weight: bold; color: #555; }
        .amount { font-size: 50px; font-weight: 800; color: var(--text-main); text-shadow: 1px 1px 0px white; }
        
        .stat-box { background: rgba(255,255,255,0.7); padding: 12px; border-radius: 20px; border: 1px solid var(--p-pink); flex: 1; }
        .stats-row { display: flex; gap: 10px; margin-bottom: 20px; }

        /* Inputs & Buttons */
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input { 
            flex: 1; padding: 14px; border-radius: 15px; border: 2px solid var(--p-pink); 
            outline: none; font-size: 14px; background: white;
        }
        input:focus { border-color: var(--accent); }
        .btn-add { background: var(--accent); color: white !important; border: none; padding: 0 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }

        .item-list { list-style: none; padding: 0; }
        li { 
            background: white; padding: 15px; border-radius: 20px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #FFE4E1; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .btn-pay { background: var(--p-green); border: 2px solid #8FBC8F; padding: 8px 15px; border-radius: 12px; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        .btn-save-record { 
            margin-top: 15px; background: white; border: 2px solid var(--accent); 
            color: var(--accent) !important; padding: 8px 20px; border-radius: 20px; 
            cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s;
        }
        .btn-save-record:hover { background: var(--accent); color: white !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button onclick="editIncome()" style="float:right; background:none; border:none; cursor:pointer; font-size:18px;">⚙️</button>
        <span id="mascot">😊</span>
        <div class="level-badge">LEVEL <span id="lv-val">1</span></div>
        <div class="xp-container"><div id="xp-bar"></div></div>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>
    <div class="legend">
        <div class="legend-item"><span class="dot" style="background:var(--p-green)"></span>วินัยดี</div>
        <div class="legend-item"><span class="dot" style="background:var(--p-yellow)"></span>ตึงๆ</div>
        <div class="legend-item"><span class="dot" style="background:var(--p-pink)"></span>อันตราย</div>
    </div>

    <div class="main-card">
        <small>🧺 เงินใช้ได้จริงวันนี้</small>
        <div id="daily-available" class="amount">0</div>
        <button class="btn-save-record" onclick="saveToday()">🌟 บันทึกสถิติวันนี้</button>
    </div>

    <div class="stats-row">
        <div class="stat-box"><small>💰 หนี้ค้าง</small><br><b id="sum-debt">0</b> ฿</div>
        <div class="stat-box"><small>🎀 ปลายเดือนเหลือ</small><br><b id="monthly-est">0</b> ฿</div>
    </div>

    <div class="input-group">
        <input type="text" id="desc" placeholder="ชื่อรายการหนี้/ออม">
        <input type="number" id="amt" placeholder="บาท">
        <button class="btn-add" onclick="addItem()">เพิ่ม</button>
    </div>

    <ul id="item-list" class="item-list"></ul>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('fin_dream_db')) || {
        dailyIncome: 300,
        items: [],
        history: {},
        xp: 0,
        lv: 1
    };

    function calculate() {
        const pendingItems = state.items.filter(i => !i.isPaid);
        const totalPending = pendingItems.reduce((s, i) => s + i.amount, 0);
        
        // หนี้รายสัปดาห์หักรายวัน
        const dailyAvailable = state.dailyIncome - (totalPending / 7);
        const monthlyEst = (state.dailyIncome * 30) - totalPending;

        document.getElementById('daily-available').innerText = Math.floor(dailyAvailable).toLocaleString();
        document.getElementById('sum-debt').innerText = totalPending.toLocaleString();
        document.getElementById('monthly-est').innerText = Math.floor(monthlyEst).toLocaleString();
        document.getElementById('lv-val').innerText = state.lv;
        document.getElementById('xp-bar').style.width = state.xp + "%";
        
        const m = document.getElementById('mascot');
        if(dailyAvailable > 150) m.innerText = "🐶"; // เปลี่ยนเป็นน้องหมาตามธีม
        else if(dailyAvailable > 50) m.innerText = "😐";
        else m.innerText = "😫";

        render();
    }

    function addXP(val) {
        state.xp += val;
        if(state.xp >= 100) {
            state.lv += 1; state.xp = 0;
            alert("🎊 เย้! เลเวลอัพเป็น Level " + state.lv + " แล้วเก่งมาก!");
        }
        save();
    }

    function addItem() {
        const desc = document.getElementById('desc').value;
        const amount = parseFloat(document.getElementById('amt').value);
        if(desc && amount) {
            state.items.push({ id: Date.now(), desc, amount, isPaid: false });
            save();
        }
    }

    function markAsPaid(id) {
        const item = state.items.find(i => i.id === id);
        if(item) {
            item.isPaid = true;
            addXP(30); 
        }
    }

    function saveToday() {
        const today = new Date().toISOString().split('T')[0];
        const current = parseInt(document.getElementById('daily-available').innerText);
        state.history[today] = current;
        addXP(15);
        alert("🌟 บันทึกเรียบร้อย! รับ 15 XP");
    }

    function editIncome() {
        const val = prompt("งบรายรับต่อวันพื้นฐาน:", state.dailyIncome);
        if(val) { state.dailyIncome = parseFloat(val); save(); }
    }

    function save() {
        localStorage.setItem('fin_dream_db', JSON.stringify(state));
        calculate();
    }

    function render() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = "";
        const now = new Date();
        for(let i=0; i<7; i++) {
            const d = new Date(); d.setDate(now.getDate() - (6-i));
            const key = d.toISOString().split('T')[0];
            const val = state.history[key];
            let status = "";
            if(val !== undefined) {
                if(val > 150) status = "status-good";
                else if(val > 50) status = "status-warning";
                else status = "status-danger";
            }
            grid.innerHTML += `<div class="cal-date ${status}">${d.getDate()}<span class="day-money">${val || '-'}</span></div>`;
        }

        const list = document.getElementById('item-list');
        list.innerHTML = "";
        state.items.filter(i => !i.isPaid).forEach(i => {
            list.innerHTML += `<li>
                <span>${i.desc} (<b>${i.amount.toLocaleString()}</b>)</span>
                <button class="btn-pay" onclick="markAsPaid(${i.id})">จ่ายแล้ว 🎀</button>
            </li>`;
        });
        document.getElementById('desc').value = "";
        document.getElementById('amt').value = "";
    }

    calculate();
</script>
</body>
</html>
