<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Life Planner 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* --- Palette สีจากรูปภาพ --- */
        :root {
            --color-red: #BB240A;        /* Vermelho Vívido */
            --color-blue: #322470;       /* Azul */
            --color-sand: #E5DBD1;       /* Areia Clara (พื้นหลัง) */
            --color-yellow: #EDCC4D;     /* Amarelo */
            --color-coffee: #623F1B;     /* Café Torrado (ตัวอักษร) */
            --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; color: var(--color-coffee); }
        body { background-color: var(--color-sand); display: flex; justify-content: center; padding: 20px; margin: 0; }

        .app-container { width: 100%; max-width: 480px; background: var(--white); border-radius: 40px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); position: relative; overflow: hidden;}
        
        /* StatusBar Simulation */
        .status-bar { display: flex; justify-content: space-between; padding: 0 10px; font-size: 14px; font-weight: bold; margin-bottom: 15px; }

        /* --- Header & Top Card --- */
        header { text-align: center; margin-bottom: 15px; }
        header p { margin: 0; font-size: 14px; opacity: 0.8; }
        
        .main-amount-card { 
            background-color: var(--color-red); 
            border-radius: 30px; 
            padding: 30px; 
            text-align: center; 
            color: var(--white);
            box-shadow: 0 10px 20px rgba(187, 36, 10, 0.2);
            margin-bottom: 15px;
        }
        .main-amount-card * { color: var(--white); }
        .main-amount-card small { font-size: 16px; font-weight: 300; }
        .main-amount-card .amount { font-size: 64px; font-weight: bold; margin: 5px 0; line-height: 1; }
        .main-amount-card .unit { font-size: 18px; }

        /* --- Summary Cards Grid --- */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .mini-card { background: #F8F9FA; border-radius: 20px; padding: 15px; text-align: center; border: 1px solid #eee;}
        .mini-card small { font-size: 12px; color: #999; display: block; margin-bottom: 5px;}
        .mini-card b { font-size: 20px; color: var(--color-coffee); }

        /* --- Tabs & Forms --- */
        .tab-container { display: flex; background: #F0F0F0; border-radius: 15px; margin-bottom: 15px; padding: 4px;}
        .tab { flex: 1; border: none; padding: 12px; cursor: pointer; background: none; border-radius: 12px; font-size: 13px; transition: 0.3s; }
        .tab.active { background: var(--white); font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        input { width: 100%; padding: 15px; margin-bottom: 10px; border: 1.5px solid #eee; border-radius: 15px; outline: none; font-size: 16px;}
        input:focus { border-color: var(--color-yellow); }
        
        .btn-main { width: 100%; background-color: var(--color-yellow); border: none; padding: 18px; border-radius: 15px; color: var(--color-coffee); font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }

        /* --- List Items --- */
        .list-container { margin-top: 15px; margin-bottom: 20px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: var(--white); padding: 15px; border-radius: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f8f8f8; }
        li span { font-size: 15px; }
        li b { font-size: 16px; }
        
        .btn-del { background: #FFEBEE; color: var(--color-red); border: none; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: bold;}

        /* --- Monthly Report --- */
        .monthly-report-card { 
            background-color: var(--white); 
            border: 2px dashed #FFCDD2; 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
        .report-header { display: flex; align-items: center; font-weight: bold; margin-bottom: 10px; }
        .report-header img { width: 20px; margin-right: 10px; }

        /* Utility */
        .reset-link { text-align: center; font-size: 12px; color: #ccc; text-decoration: underline; cursor: pointer; margin-top: 20px; display: block;}
        
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-bar">
        <span>12:26 📱</span>
        <span>📶 🔋 62</span>
    </div>

    <header>
        <div class="main-amount-card">
            <small>งบกินอยู่ "ห้ามเกิน" วันนี้</small>
            <div id="daily-available" class="amount">112</div>
            <div class="unit">บาท</div>
        </div>
    </header>

    <div class="summary-grid">
        <div class="mini-card">
            <small>หนี้ที่ต้องกันไว้</small>
            <b id="weekly-debt">890 ฿</b>
        </div>
        <div class="mini-card">
            <small>ต้องออมวันนี้</small>
            <b id="total-saving">60 ฿</b>
        </div>
    </div>

    <div class="tab-container">
        <button class="tab active" onclick="switchTab('debt')">หนี้สัปดาห์หน้า</button>
        <button class="tab" onclick="switchTab('goal')">กองเงินสะสม</button>
        <button class="tab" onclick="switchTab('note')">บันทึก/คนยืม</button>
    </div>

    <div id="standard-form">
        <input type="text" id="item-desc" placeholder="เช่น ค่าเน็ต, เก็บซื้อชุด">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px;">
            <input type="number" id="item-amount" placeholder="จำนวนเงิน">
            <input type="number" id="item-days" placeholder="กี่วัน" style="display:none;">
        </div>
        <button onclick="addNewItem()" class="btn-main">เพิ่มรายการ</button>
    </div>

    <div class="list-container">
        <ul id="display-list">
            <li><span>ค่าเน็ต</span> <b>500 ฿</b> <button class="btn-del">ลบ</button></li>
            <li><span>ค่าของ</span> <b>390 ฿</b> <button class="btn-del">ลบ</button></li>
        </ul>
    </div>

    <div class="monthly-report-card">
        <div class="report-header">
            📊 ประมาณการรายเดือน
        </div>
        <div id="monthly-report-text">
            รายรับ: 9,000 | คงเหลือสุทธิ: 3,385.714 ฿
        </div>
    </div>
    
    <span class="reset-link" onclick="clearData()">เริ่มใหม่ทั้งหมด</span>
</div>

<script>
    // --- JavaScript Logic (คงเดิมจากเวอร์ชัน Ultimate เพื่อความถูกต้องของการคำนวณ) ---
    let debts = JSON.parse(localStorage.getItem('debts')) || [];
    let goals = JSON.parse(localStorage.getItem('goals')) || [];
    let activeTab = 'debt';

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
        document.getElementById('item-days').style.display = tab === 'goal' ? 'block' : 'none';
        renderAll();
    }

    function calculateAll() {
        // สมมติรายรับรายวันตามตัวอย่างรูปภาพคือ 300 บาท (9,000 / 30)
        const income = 300; 
        const saveRate = 10; // ออม 10%

        const totalDebt = debts.reduce((s, i) => s + i.amount, 0);
        const dailyDebtPart = totalDebt / 7;
        const dailyGoalPart = goals.reduce((s, i) => s + (i.amount / i.days), 0);
        const basicSaving = income * (saveRate / 100);

        const available = income - dailyDebtPart - dailyGoalPart - basicSaving;

        // อัปเดตหน้าจอ
        document.getElementById('daily-available').innerText = Math.floor(available).toLocaleString();
        document.getElementById('weekly-debt').innerText = totalDebt.toLocaleString() + " ฿";
        document.getElementById('total-saving').innerText = Math.floor(dailyGoalPart + basicSaving).toLocaleString() + " ฿";

        // สรุปรายเดือน
        const mIncome = income * 30;
        const mExp = (dailyDebtPart + dailyGoalPart + basicSaving) * 30;
        document.getElementById('monthly-report-text').innerText = `รายรับ: ${mIncome.toLocaleString()} | คงเหลือสุทธิ: ${(mIncome - mExp).toLocaleString()} ฿`;
    }

    function addNewItem() {
        const desc = document.getElementById('item-desc').value;
        const amount = parseFloat(document.getElementById('item-amount').value);
        const days = parseInt(document.getElementById('item-days').value) || 7;

        if (!desc || !amount) return alert("กรอกข้อมูลให้ครบก่อนนะจ๊ะ");

        if (activeTab === 'debt') debts.push({ desc, amount, id: Date.now() });
        else if (activeTab === 'goal') goals.push({ desc, amount, days, id: Date.now() });

        saveData();
        document.getElementById('item-desc').value = '';
        document.getElementById('item-amount').value = '';
        document.getElementById('item-days').value = '';
    }

    function deleteItem(id, type) {
        if (type === 'debt') debts = debts.filter(i => i.id !== id);
        else if (type === 'goal') goals = goals.filter(i => i.id !== id);
        saveData();
    }

    function saveData() {
        localStorage.setItem('debts', JSON.stringify(debts));
        localStorage.setItem('goals', JSON.stringify(goals));
        renderAll();
    }

    function renderAll() {
        const list = document.getElementById('display-list');
        list.innerHTML = "";
        
        if (activeTab === 'debt') {
            debts.forEach(i => list.innerHTML += `<li><span>${i.desc}</span> <b>${i.amount} ฿</b> <button class="btn-del" onclick="deleteItem(${i.id},'debt')">ลบ</button></li>`);
        } else if (activeTab === 'goal') {
            goals.forEach(i => list.innerHTML += `<li><span>${i.desc}</span> <b>${i.amount} ฿</b> <button class="btn-del" onclick="deleteItem(${i.id},'goal')">ลบ</button></li>`);
        } else if (activeTab === 'note') {
            list.innerHTML = "<li><span>(ฟังก์ชันโน้ตยังไม่ได้รวมในหน้านี้)</span></li>";
        }
        calculateAll();
    }

    function clearData() { if(confirm("ล้างข้อมูลทั้งหมด?")) { localStorage.clear(); location.reload(); } }

    // Initialize
    renderAll();
</script>

</body>
</html>
